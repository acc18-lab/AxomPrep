<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details | AxomPrep</title><meta name="description" content="Recruitment details, eligibility, important dates and official application links on AxomPrep.">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand-logo.css"><link rel="stylesheet" href="axomprep-theme.css">
<style>
:root{--job-ink:#17365f;--job-blue:#2458d3;--job-orange:#f28b24;--job-border:#dfe7f1;--job-muted:#65758b}
body{background:#f4f7fb;color:var(--job-ink)}.job-shell{max-width:1120px;margin:34px auto;padding:0 20px 60px}.job-breadcrumb{font-size:13px;color:var(--job-muted);margin-bottom:16px}.job-breadcrumb a{color:var(--job-blue);text-decoration:none;font-weight:700}.job-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.job-panel{background:#fff;border:1px solid var(--job-border);border-radius:18px;box-shadow:0 12px 30px rgba(22,49,87,.06);padding:26px;margin-bottom:18px}.job-kicker{display:inline-flex;background:#edf3ff;color:var(--job-blue);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em}.job-title{font-size:clamp(27px,4vw,38px);line-height:1.16;margin:16px 0 10px;color:#142f54;font-weight:850}.job-subtitle{color:var(--job-muted);font-size:15px;line-height:1.7}.job-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.job-badge{font-size:12px;font-weight:750;padding:7px 10px;border-radius:9px;background:#f1f5f9;color:#334155}.job-badge.open{background:#e8f8ef;color:#187344}.job-badge.closed{background:#fff0f0;color:#b42318}.job-section-title{font-size:19px;font-weight:800;margin:0 0 16px;color:#19395f}.job-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.job-fact{border:1px solid #e8eef5;border-radius:12px;padding:14px;min-width:0}.job-fact span{display:block;color:var(--job-muted);font-size:12px;margin-bottom:6px}.job-fact strong{display:block;color:#1b3556;font-size:14px;overflow-wrap:anywhere}.job-prose{font-size:15px;line-height:1.8;color:#41556e}.job-prose p{margin:0 0 12px}.job-links{display:grid;gap:10px}.job-link{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:800;padding:13px 16px;border-radius:11px}.job-link.primary{background:var(--job-orange);color:white}.job-link.secondary{background:#edf3ff;color:#214eae}.job-link.tertiary{border:1px solid var(--job-border);color:#214eae;background:white}.job-note{font-size:12px;color:var(--job-muted);line-height:1.65;margin-top:15px}.job-state{padding:20px;border-radius:12px;background:#f8fafc;color:#53657b}.job-error{color:#a22b2b}.job-list{padding-left:20px;margin:0;color:#41556e;line-height:1.8}.job-updated{font-size:12px;color:#718096;margin-top:14px}@media(max-width:820px){.job-layout{grid-template-columns:1fr}.job-shell{margin-top:20px}.job-panel{padding:20px}.job-facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.job-facts{grid-template-columns:1fr}}
</style></head><body>
<header class="axu-header"><div class="axu-header-inner"><a href="index.html" class="axu-brand" aria-label="AxomPrep Home"><img src="assets/axomprep-logo.png" alt="AxomPrep" onerror="this.style.display='none'"><span>AxomPrep</span></a><nav class="axu-nav"><a href="index.html">Home</a><a href="practice.html">Practice</a><a href="daily-quiz.html">Daily Quiz</a><a href="current-affairs.html">Current Affairs</a><a class="axu-active" href="current-jobs.html">Jobs</a><a href="books.html">Books</a><a href="premium.html">Premium</a></nav><a class="axu-header-cta" href="current-jobs.html">All jobs</a></div></header>
<main class="job-shell"><div class="job-breadcrumb"><a href="index.html">Home</a> / <a href="current-jobs.html">Latest Jobs</a> / Job details</div>
<div id="jobContent"><div class="job-panel job-state">Loading recruitment details…</div></div>
<div class="job-updated">AxomPrep summarises public recruitment notices for easier discovery. Always confirm details with the official notification before applying.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="site-auth.js"></script>
<script>
(function(){'use strict';const root=document.getElementById('jobContent');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const url=u=>{try{const x=new URL(String(u||''),location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch(_){return ''}};const date=d=>{if(!d)return 'Not specified';const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?String(d):x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'})};const val=(label,value)=>`<div class="job-fact"><span>${esc(label)}</span><strong>${esc(value||'Not specified')}</strong></div>`;
function render(j){const n=j.application_last_date?Math.ceil((new Date(j.application_last_date+'T23:59:59')-new Date())/86400000):null;const closed=j.status==='closed'||(n!==null&&n<0);const source=url(j.source_url),official=url(j.official_url),apply=url(j.apply_url);const intro=`${j.organization||'The recruiting organisation'} has published a recruitment update for ${j.post_name||j.title||'the advertised position'}. AxomPrep has arranged the key information below to make the notice easier to review.`;const desc=j.description&&j.description.trim()?j.description.trim():intro;
root.innerHTML=`<div class="job-layout"><div><section class="job-panel"><span class="job-kicker">${esc(j.category||'RECRUITMENT UPDATE')}</span><h1 class="job-title">${esc(j.title||'Recruitment Notification')}</h1><div class="job-subtitle">${esc(j.organization||'Recruiting organisation not specified')} · ${esc(j.location||'Location as mentioned in notice')}</div><div class="job-badges"><span class="job-badge ${closed?'closed':'open'}">${closed?'Applications may be closed':n!==null&&n<=3?'Closing soon':'Check application status'}</span><span class="job-badge">${esc(j.vacancies||'Vacancy count in notice')} vacancies</span><span class="job-badge">${esc(j.source_name||'Source listing')}</span></div></section>
<section class="job-panel"><h2 class="job-section-title">Recruitment overview</h2><div class="job-prose"><p>${esc(intro)}</p><p>${esc(desc)}</p></div><div class="job-facts">${val('Organisation',j.organization)}${val('Post / role',j.post_name||j.title)}${val('Total vacancies',j.vacancies)}${val('Job location',j.location)}${val('Qualification',j.qualification)}${val('Age limit',j.age_limit)}${val('Salary / pay',j.salary)}${val('Application fee',j.application_fee)}${val('Application opens',date(j.application_start_date))}${val('Last date to apply',date(j.application_last_date))}</div></section>
<section class="job-panel"><h2 class="job-section-title">Before you apply</h2><ul class="job-list"><li>Read the official notification for complete eligibility, age relaxation, category-wise vacancies, documents and selection process.</li><li>Check the application deadline and any corrigendum on the recruiting organisation's website.</li><li>Apply only through a verified official portal and keep your submission receipt.</li></ul></section></div>
<aside><section class="job-panel"><h2 class="job-section-title">Application links</h2><div class="job-links">${apply?`<a class="job-link primary" href="${esc(apply)}" target="_blank" rel="noopener noreferrer">Apply online ↗</a>`:''}${official?`<a class="job-link secondary" href="${esc(official)}" target="_blank" rel="noopener noreferrer">Official notification ↗</a>`:''}${source?`<a class="job-link tertiary" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Source reference ↗</a>`:''}<a class="job-link tertiary" href="current-jobs.html">Browse all jobs</a></div><p class="job-note">Some details may not be present in the listing feed. Verify all dates, fees, eligibility and instructions in the official notification.</p></section><section class="job-panel"><h2 class="job-section-title">Key dates</h2><div class="job-facts" style="grid-template-columns:1fr">${val('Notification date',date(j.posted_date))}${val('Application start',date(j.application_start_date))}${val('Application deadline',date(j.application_last_date))}</div><p class="job-note">Last checked: ${esc(j.last_verified?new Date(j.last_verified).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}):'Not available')}</p></section></aside></div>`;}
async function init(attempt=0){const cfg=window.AXOMPREP_CONFIG;if(!cfg||!cfg.supabaseUrl||!cfg.supabasePublishableKey||!window.supabase){if(attempt<40){setTimeout(()=>init(attempt+1),250);return;}root.innerHTML='<div class="job-panel job-state job-error">The job service did not load. Please refresh or return to <a href="current-jobs.html">all jobs</a>.</div>';return;}const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9a-f-]{20,}$/i.test(id)){root.innerHTML='<div class="job-panel job-state">No job was selected. <a href="current-jobs.html">Browse current jobs</a> and select a listing.</div>';return;}try{const db=window.AXOMPREP_AUTH_CLIENT||window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data,error}=await db.from('current_jobs_v1').select('*').eq('id',id).maybeSingle();if(error)throw error;if(!data){root.innerHTML='<div class="job-panel job-state">This listing could not be found. It may have been removed or updated. <a href="current-jobs.html">Browse current jobs</a>.</div>';return;}document.title=(data.title||'Job Details')+' | AxomPrep';render(data);}catch(e){console.error('AxomPrep job detail load failed',e);root.innerHTML='<div class="job-panel job-state job-error">Could not load this job right now. Please try again or use <a href="current-jobs.html">the current jobs list</a>.</div>';}}
init();})();
</script></body></html>
