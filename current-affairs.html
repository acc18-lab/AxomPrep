<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current Affairs | AxomPrep</title><link rel="stylesheet" href="styles.css"><style>.ca-shell{max-width:1100px;margin:auto;padding:34px 18px}.ca-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.ca-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.ca-filters select,.ca-filters input{padding:11px 12px;border:1px solid #d7deea;border-radius:9px;font:inherit}.ca-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.ca-card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(20,45,80,.06)}.ca-card img{width:100%;height:160px;object-fit:cover}.ca-card-body{padding:18px}.ca-card h3{margin:8px 0}.ca-card p{color:#5d6a7e;line-height:1.55}.ca-meta{font-size:12px;color:#6c788b}.empty{padding:30px;background:#fff;border:1px solid #e4e9f1;border-radius:14px}@media(max-width:800px){.ca-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.ca-grid{grid-template-columns:1fr}.ca-head{display:block}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>Axom<span>Prep</span></span></a><div class="nav-actions"><a class="btn ghost" href="index.html">Home</a><a class="btn primary" href="dashboard.html">Dashboard</a></div></header><main class="ca-shell"><div class="ca-head"><div><div class="eyebrow">STAY UPDATED</div><h1>Current Affairs</h1><p>Assam, India, world and exam-focused current affairs.</p></div></div><div class="ca-filters"><input id="search" placeholder="Search current affairs..." style="flex:1;min-width:220px"><select id="category"><option value="">All categories</option><option>Assam</option><option>India</option><option>World</option><option>Economy</option><option>Sports</option><option>Science</option><option>Government</option><option>Environment</option></select></div><div id="grid" class="ca-grid"><div class="empty">Loading current affairs…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const client=supabase.createClient(AXOMPREP_CONFIG.supabaseUrl,AXOMPREP_CONFIG.supabasePublishableKey);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let all=[];async function load(){const {data,error}=await client.from('current_affairs_v1').select('id,title,title_assamese,summary,summary_assamese,content,content_assamese,category,published_date,source_name,source_url,image_url,featured').eq('status','published').order('published_date',{ascending:false}).limit(200);if(error){$('grid').innerHTML='<div class="empty">Unable to load current affairs.</div>';return}all=data||[];render()}function render(){const q=$('search').value.toLowerCase().trim(),cat=$('category').value;const rows=all.filter(x=>(!cat||x.category===cat)&&(!q||[x.title,x.title_assamese,x.summary,x.summary_assamese,x.content,x.category].join(' ').toLowerCase().includes(q)));$('grid').innerHTML=rows.map(x=>`<article class="ca-card">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:''}<div class="ca-card-body"><div class="ca-meta">${esc(x.category)} • ${esc(x.published_date)}${x.featured?' • Featured':''}</div><h3>${esc(x.title)}</h3>${x.title_assamese?`<div>${esc(x.title_assamese)}</div>`:''}<p>${esc((x.summary||x.summary_assamese||x.content||'').slice(0,220))}${(x.summary||x.summary_assamese||x.content||'').length>220?'…':''}</p>${x.source_name?`<div class="ca-meta">Source: ${esc(x.source_name)}${x.source_url?` · <a href="${esc(x.source_url)}" target="_blank" rel="noopener">Read source</a>`:''}</div>`:''}</div></article>`).join('')||'<div class="empty">No current affairs match your filters.</div>'} $('search').oninput=render;$('category').onchange=render;load();</script></body></html>
